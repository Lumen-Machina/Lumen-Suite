name: Idea
description: Suggest a feature or a change.
labels: [idea]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [Lumen-Index, Lumen-Haze, Lumen-Oxide, Lumen-Serra, The whole suite]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you'd like, and what you'd use it for.
    validations:
      required: true
