name: Bug report
description: Something in a Lumen plugin doesn't work as it should.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [Lumen-Index, Lumen-Haze, Lumen-Oxide, Lumen-Serra]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.1"
  - type: input
    id: setup
    attributes:
      label: Computer and host
      description: Windows or Mac, and the DAW or app you used (with its version).
      placeholder: "Windows 11, Bitwig Studio 5.3"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
